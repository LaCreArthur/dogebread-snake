<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DogeBread Snake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: monospace;
            color: #fff;
        }
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #bevy {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="bevy"></canvas>
        <div id="loading">Loading DogeBread Snake...</div>
    </div>
    <script type="module">
        import init from './client.js';

        async function run() {
            try {
                await init();
                document.getElementById('loading').style.display = 'none';
            } catch (e) {
                console.error('Failed to load WASM:', e);
                document.getElementById('loading').innerHTML = 'Failed to load game:<br>' + e;
            }
        }

        run();
    </script>
</body>
</html>
